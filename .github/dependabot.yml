version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm rejects releases younger than a day (minimumReleaseAge); wait
    # before proposing them. Security updates are not delayed.
    cooldown:
      default-days: 2
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node LTS (even majors).
      - dependency-name: node
        versions: ['27']
    groups:
      docker-images:
        patterns: ['*']
