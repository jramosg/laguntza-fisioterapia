name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: VPS environment
        type: choice
        default: test
        options: [test, production, mail]
      server_task:
        description: Server operation
        type: choice
        default: deploy
        options: [deploy, inspect-routing, repair-routing]

permissions:
  contents: read

concurrency:
  group: laguntza-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_ENV: ${{ inputs.environment || 'test' }}
      OPERATION: ${{ inputs.server_task || 'deploy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require master for production
        if: env.TARGET_ENV == 'production'
        run: test "$GITHUB_REF" = refs/heads/master
      - name: Validate operation
        run: |
          case "$TARGET_ENV" in test|production|mail) ;; *) exit 1 ;; esac
          case "$OPERATION" in deploy|inspect-routing|repair-routing) ;; *) exit 1 ;; esac
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.OPERATION == 'deploy'
        with:
          node-version-file: .nvmrc
      - name: Validate and build
        if: env.OPERATION == 'deploy'
        run: |
          npm install --global pnpm@12.16.1
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate
          pnpm run format:check
          pnpm run check
          pnpm test
          pnpm build
          pnpm run test:integration
      - name: Build runtime and static archive
        if: env.OPERATION == 'deploy'
        run: |
          mkdir -p deployment
          docker build -t "laguntza-web:$GITHUB_SHA" .
          docker create --name static-export "laguntza-web:$GITHUB_SHA"
          docker cp static-export:/app/dist/client ./deployment/client
          docker rm static-export
          tar -czf deployment/client.tar.gz -C deployment/client .
          rm -rf deployment/client
          docker save "laguntza-web:$GITHUB_SHA" | gzip > deployment/image.tar.gz
          cp deploy/release.py deployment/release.py
          tar -czf deployment.tar.gz -C deployment .
      - name: Scan runtime image before deployment
        if: env.OPERATION == 'deploy'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: laguntza-web:${{ github.sha }}
          format: table
          scanners: vuln,secret
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Prepare SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/laguntza-ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/laguntza-ssh/key"
          chmod 600 "$RUNNER_TEMP/laguntza-ssh/key"
      - name: Deploy immutable release
        if: env.OPERATION == 'deploy'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          scp -i "$RUNNER_TEMP/laguntza-ssh/key" -P "$SERVER_PORT" -o StrictHostKeyChecking=yes -o HostKeyAlias=165.232.80.23 -o UserKnownHostsFile=deploy/known_hosts deployment.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/laguntza-$GITHUB_RUN_ID.tar.gz"
          ssh -i "$RUNNER_TEMP/laguntza-ssh/key" -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o HostKeyAlias=165.232.80.23 -o UserKnownHostsFile=deploy/known_hosts "$SERVER_USER@$SERVER_HOST" "set -e; install -d -m 700 /tmp/laguntza-$GITHUB_RUN_ID; tar -xzf /tmp/laguntza-$GITHUB_RUN_ID.tar.gz -C /tmp/laguntza-$GITHUB_RUN_ID; sudo python3 /tmp/laguntza-$GITHUB_RUN_ID/release.py '$TARGET_ENV' '$GITHUB_SHA' /tmp/laguntza-$GITHUB_RUN_ID; rm -rf /tmp/laguntza-$GITHUB_RUN_ID /tmp/laguntza-$GITHUB_RUN_ID.tar.gz"
      - name: Test routing maintenance
        if: env.OPERATION != 'deploy'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          ssh -i "$RUNNER_TEMP/laguntza-ssh/key" -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o HostKeyAlias=165.232.80.23 -o UserKnownHostsFile=deploy/known_hosts "$SERVER_USER@$SERVER_HOST" "sudo python3 - '$OPERATION'" < scripts/repair_test_routing.py
      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/laguntza-ssh/key"
