name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: VPS environment
        type: choice
        default: test
        options: [test, production]

permissions:
  contents: read

concurrency:
  group: laguntza-${{ inputs.environment || 'test' }}-server
  cancel-in-progress: false

jobs:
  build:
    name: Validate and scan release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_ENV: ${{ inputs.environment || 'test' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate target
        run: |
          case "$TARGET_ENV" in test|production) ;; *) exit 1 ;; esac
          if [ "$TARGET_ENV" != test ]; then test "$GITHUB_REF" = refs/heads/master; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate and build
        run: |
          npm install --global pnpm@12.18.0
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate
          pnpm run format:check
          pnpm run check
          pnpm test
          pnpm build
          pnpm run test:integration
      - name: Build runtime and static archive
        run: |
          mkdir -p deployment
          docker build -t "laguntza-web:$GITHUB_SHA" .
          docker create --name static-export "laguntza-web:$GITHUB_SHA"
          docker cp static-export:/app/dist/client ./deployment/client
          docker rm static-export
          tar -czf deployment/client.tar.gz -C deployment/client .
          rm -rf deployment/client
          docker save "laguntza-web:$GITHUB_SHA" | gzip > deployment/image.tar.gz
          tar -czf deployment.tar.gz -C deployment client.tar.gz image.tar.gz
          sha256sum deployment.tar.gz > deployment.sha256
      - name: Scan runtime image before deployment
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: laguntza-web:${{ github.sha }}
          format: table
          scanners: vuln,secret
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laguntza-${{ github.sha }}
          path: |
            deployment.tar.gz
            deployment.sha256
          compression-level: 0
          retention-days: 3

  deploy:
    name: Publish validated release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment == 'test' && 'Test' || 'Production' }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'test' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: laguntza-${{ github.sha }}
          path: ${{ runner.temp }}/laguntza-release
      - name: Verify artifact
        working-directory: ${{ runner.temp }}/laguntza-release
        run: sha256sum --check deployment.sha256
      - name: Prepare scoped SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/laguntza-ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/laguntza-ssh/key"
          chmod 600 "$RUNNER_TEMP/laguntza-ssh/key"
      - name: Publish through fixed server helper
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          case "$TARGET_ENV" in test|production) ;; *) exit 1 ;; esac
          ssh -T -i "$RUNNER_TEMP/laguntza-ssh/key" -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o HostKeyAlias=165.232.80.23 -o UserKnownHostsFile=deploy/known_hosts "$SERVER_USER@$SERVER_HOST" "publish $TARGET_ENV $GITHUB_SHA" < "$RUNNER_TEMP/laguntza-release/deployment.tar.gz"
      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/laguntza-ssh/key"
